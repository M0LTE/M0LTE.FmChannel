name: ci

# GitHub-hosted, NOT the [self-hosted, Linux, X64] the packet-net repositories use. That house rule
# exists because those repositories have no Actions minutes budget - but this one is public, where
# GitHub-hosted minutes are free and unlimited, and the self-hosted runners are registered to the
# packet-net org, so a job asking for them here would queue for ever.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build
