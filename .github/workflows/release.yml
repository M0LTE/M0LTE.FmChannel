name: release

# Cut a NuGet package for a `v*` tag. workflow_dispatch builds and leaves the package as a
# workflow artifact without publishing anything - a dry run of the whole pipeline. Set
# `publish: true` to also push it to nuget.org.
#
# Publishing uses NuGet TRUSTED PUBLISHING rather than a long-lived API key: the job asks GitHub
# for a short-lived OIDC token, nuget.org checks it against a policy naming this repository and
# this workflow, and hands back a temporary key. Nothing secret is stored anywhere, so there is no
# key to leak, rotate or accidentally print.
#
# What has to exist on nuget.org for the push step to work:
#   - a Trusted Publishing policy on the M0LTE.FmChannel package (or a reserved prefix) for
#     repository M0LTE/M0LTE.FmChannel, workflow release.yml, on the main branch
#   - a repository variable NUGET_USER holding the nuget.org account that owns that policy
# Until both are in place, run this with publish:false - the build and pack steps are unaffected.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.1.0 or 0.1.0-rc1)'
        required: true
      publish:
        description: 'Also push to NuGet'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # The whole point of trusted publishing: this is what lets the job prove to nuget.org which
  # repository and workflow it is, without holding a credential.
  id-token: write

jobs:
  release:
    # GitHub-hosted for the same reason as ci.yml: this repository is public, so the minutes are
    # free, and the self-hosted runners belong to a different org.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ github.event.inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version"

      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: dotnet pack src/M0LTE.FmChannel/M0LTE.FmChannel.csproj -c Release
             -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*

      # Exchanges this job's OIDC token for a short-lived nuget.org key. Fails loudly if the
      # trusted-publishing policy or the NUGET_USER variable is missing, which is the right
      # behaviour - a silent skip would look like a successful release that published nothing.
      - name: Get a short-lived NuGet key
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
